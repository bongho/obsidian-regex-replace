name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            # `build` is the only script this repo defines today. `lint` and
            # `test` are guarded with --if-present so adding either later needs
            # no workflow change: there is an .eslintrc but no eslint dependency
            # and no lint script, and no test runner at all.
            - run: npm run build --if-present
            - run: npm run lint --if-present
            - run: npm test --if-present
